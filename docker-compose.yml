version: '3.8'  
services:  
  mongo:  
    image: mongo:latest  
    container_name: mongo_db  
    restart: always  
    volumes:  
      - mongo_data:/data/db  
  
  backend:  
    build:  
      context: ./backend  
    container_name: backend_service  
    restart: always  
    depends_on:  
      - mongo  
    environment:  
      - MONGO_URI=mongodb://mongo:27017/mydatabase  
  
  nginx:  
    image: nginx:latest  
    container_name: nginx_proxy  
    restart: always  
    ports:  
      - "80:80"  
    volumes:  
      - ./nginx.conf:/etc/nginx/nginx.conf  
      - ./frontend:/usr/share/nginx/html  

volumes:  
  mongo_data:  
